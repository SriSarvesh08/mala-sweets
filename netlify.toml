[build]
  # Directory that contains the deploy-ready HTML files and assets generated by the build
  publish = "frontend"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  condition = {Role = ["admin"]} # Just a generic redirect if needed, but since it's a multi-page app, standard routing works fine.

# Better redirect for multi-page apps to avoid 404s on clean URLs
[[redirects]]
  from = "/admin"
  to = "/pages/admin.html"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/pages/cart.html"
  status = 200

[[redirects]]
  from = "/products"
  to = "/pages/products.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/pages/checkout.html"
  status = 200

[[redirects]]
  from = "/success"
  to = "/pages/success.html"
  status = 200
