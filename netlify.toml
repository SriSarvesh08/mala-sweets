[build]
  command   = "echo 'Static frontend — no build step needed'"
  publish   = "frontend"

# ─── API Proxy → Render Backend ───────────────────────────────────────────────
# All /api/* calls from the Netlify frontend are proxied to Render.
# This completely avoids CORS issues because the browser sees same-origin requests.
[[redirects]]
  from   = "/api/*"
  to     = "https://mala-sweets.onrender.com/api/:splat"
  status = 200
  force  = true

# ─── Uploads Proxy → Render Backend ──────────────────────────────────────────
# Product images are stored on Render's /uploads folder — proxy them here.
[[redirects]]
  from   = "/uploads/*"
  to     = "https://mala-sweets.onrender.com/uploads/:splat"
  status = 200
  force  = true

# ─── Page Routes (clean URLs) ─────────────────────────────────────────────────
[[redirects]]
  from   = "/admin"
  to     = "/pages/admin.html"
  status = 200

[[redirects]]
  from   = "/cart"
  to     = "/pages/cart.html"
  status = 200

[[redirects]]
  from   = "/products"
  to     = "/pages/products.html"
  status = 200

[[redirects]]
  from   = "/checkout"
  to     = "/pages/checkout.html"
  status = 200

[[redirects]]
  from   = "/success"
  to     = "/pages/success.html"
  status = 200

# ─── Fallback (must be last) ──────────────────────────────────────────────────
# Returns the root index for any unknown path (prevents 404 on refresh)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
